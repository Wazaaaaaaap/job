    const next = cur === "dark" ? "light" : cur === "light" ? "dark"
      : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("radar-theme", next); }catch(e){}
  });

  // ------------------------------------------------------------- helpers
  const BANDS = [
    {key:"قدّم اليوم",   min:72, stripe:"var(--accent)",   note:"تطابق عالٍ مع السيرة — الأولوية القصوى"},
    {key:"مرشّح قوي",    min:58, stripe:"var(--accent)",   note:"تطابق جيد، يستحق تخصيص خطاب تقديم"},
    {key:"يستحق النظر",  min:44, stripe:"var(--amber)",    note:"تطابق جزئي — راجع المتطلبات قبل التقديم"},
    {key:"احتمال ضعيف",  min:30, stripe:"var(--slate)",    note:"فجوة واضحة في الخبرة أو التخصص"}
  ];
  const band = s => BANDS.find(b => s >= b.min) || {key:"دون العتبة", min:0, stripe:"var(--ink-3)", note:""};
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const dayjs = iso => { if(!iso) return null; const d = new Date(iso); return isNaN(d)?null:d; };
  const ageDays = j => {
    const d = dayjs(j.posted_at) || dayjs(j.first_seen);
    if(!d) return null;
    return Math.max(0, Math.round((Date.now() - d.getTime())/864e5));
  };
  const AR = new Intl.NumberFormat("ar-SA");
  function fmtAge(n){
    if(n === null) return "تاريخ غير معلن";
    if(n === 0) return "اليوم";
    if(n === 1) return "أمس";
    if(n === 2) return "قبل يومين";
    if(n <= 10) return "قبل " + AR.format(n) + " أيام";
    return "قبل " + AR.format(n) + " يومًا";
  }

  const SRC_LABEL = {workday:"Workday", oracle:"Oracle", greenhouse:"Greenhouse", lever:"Lever",
    smartrecruiters:"SmartRecruiters", ashby:"Ashby", recruitee:"Recruitee", jadarat:"جدارات",
    sabbar:"صبار", taqat:"طاقات", aggregator:"موقع تجميعي", browser:"موقع الشركة", manual:"إدخال يدوي"};
  const srcName = j => SRC_LABEL[j.source_family] || j.source_family || j.source;

  // -------------------------------------------------------------- state
  // "جديد" only means something once there is a previous run to be new against.
  // On the very first batch every row would carry it, which is noise, so the
  // badge is suppressed when nearly everything is new.
  const NEW_MS = 36e5 * 30;
  const newCount = jobs.filter(j => (Date.now() - new Date(j.first_seen).getTime()) < NEW_MS).length;
  const SHOW_NEW = jobs.length > 0 && newCount / jobs.length < 0.7;

  const state = {q:"", city:"", source:"", age:"all", sort:"score"};
  try{
    const saved = JSON.parse(localStorage.getItem("radar-filters")||"null");
    if(saved) Object.assign(state, saved);
  }catch(e){}
  const persist = () => { try{ localStorage.setItem("radar-filters", JSON.stringify(state)); }catch(e){} };

  // ------------------------------------------------------------- filters
  const cities = [...new Set(jobs.map(j=>j.city_ar).filter(Boolean))].sort();
  const sources = [...new Set(jobs.map(srcName).filter(Boolean))].sort();
  const fill = (el, items, allLabel) => {
    el.innerHTML = '<option value="">' + allLabel + "</option>" +
      items.map(x => '<option value="'+esc(x)+'">'+esc(x)+"</option>").join("");
  };
  const cityEl = document.getElementById("city"), srcEl = document.getElementById("source");
  fill(cityEl, cities, "كل المدن"); fill(srcEl, sources, "كل المصادر");
  cityEl.value = state.city; srcEl.value = state.source;
  document.getElementById("q").value = state.q;
  document.getElementById("sort").value = state.sort;
  document.querySelectorAll("[data-age]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.age === state.age)));

  function apply(){
    const q = state.q.trim().toLowerCase();
    let out = jobs.filter(j => {
      if(state.city && j.city_ar !== state.city) return false;
      if(state.source && srcName(j) !== state.source) return false;
      if(state.age !== "all"){
        const a = ageDays(j);
        if(a === null || a > Number(state.age)) return false;
      }
      if(q){
        const hay = (j.title+" "+j.company+" "+(j.description||"")).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    if(state.sort === "score") out.sort((a,b)=> b.score - a.score);
    if(state.sort === "new") out.sort((a,b)=> String(b.first_seen).localeCompare(String(a.first_seen)));
    if(state.sort === "posted") out.sort((a,b)=> String(b.posted_at||"").localeCompare(String(a.posted_at||"")));
    return out;
  }

  // ------------------------------------------------------------- render
  function bdRow(label, obj){
    if(!obj) return "";
    const pct = obj.max ? Math.round(100*obj.score/obj.max) : 0;
    return '<div class="bd-item"><span>'+esc(label)+'</span>'+
      '<span class="track"><i style="width:'+pct+'%"></i></span>'+
      '<span class="val">'+obj.score+"/"+obj.max+"</span></div>";
  }

  function card(j){
    const b = band(j.score), a = ageDays(j), bd = j.score_breakdown || {};
    const isNew = SHOW_NEW && (Date.now() - new Date(j.first_seen).getTime()) < NEW_MS;
    const skills = (j.matched_skills||[]).slice(0,12)
      .map(s => '<span class="skill">'+esc(s)+"</span>").join("");
    const gaps = (j.missing_signals||[]).slice(0,6)
      .map(s => '<span class="gap">'+esc(s)+"</span>").join("");
    const alt = (j.also_on||[]).map(x =>
      '<a class="chip src" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.source)+"</a>").join(" ");
    const yrs = bd.seniority && bd.seniority.required_years;
    return '<article class="row" style="--stripe:'+b.stripe+'">'+
      '<div class="row-head" role="button" tabindex="0">'+
        '<div class="gauge"><div class="num">'+j.score.toFixed(0)+'</div>'+
          '<div class="bar"><i style="width:'+Math.min(100,j.score)+'%"></i></div></div>'+
        '<div class="title-cell"><h3>'+esc(j.title)+"</h3>"+
          '<div class="meta"><strong>'+esc(j.company)+"</strong>"+
            '<span class="chip city">'+esc(j.city_ar||j.city_en)+"</span>"+
            '<span class="chip src">'+esc(srcName(j))+"</span>"+
            '<span class="chip age">'+fmtAge(a)+"</span>"+
            (yrs!=null ? '<span class="chip">يطلب '+AR.format(yrs)+" سنة خبرة</span>" : "")+
            (isNew ? '<span class="chip new">جديد</span>' : "")+
          "</div></div>"+
        '<button class="expand" type="button" aria-label="تفاصيل">▾</button>'+
      "</div>"+
      '<div class="detail">'+
        '<div class="detail-grid">'+
          '<div><p class="dl">من أين جاءت الدرجة</p><div class="bd">'+
            bdRow("المسمى الوظيفي", bd.title)+
            bdRow("تغطية المهارات", bd.skills)+
            bdRow("مستوى الخبرة", bd.seniority)+
            bdRow("الموقع", bd.location)+
            bdRow("حداثة الإعلان", bd.freshness)+
          "</div>"+
          (bd.thin ? '<p class="note" style="color:var(--amber)">وصف الإعلان لم يُجلب لهذا الشاغر، '+
            'فاستُبعد معيار المهارات وأُعيد توزيع الأوزان على المعايير الأربعة الباقية بدل احتسابه صفرًا.</p>' : "")+
          (bd.seniority && bd.seniority.note ? '<p class="note">'+esc(bd.seniority.note)+"</p>" : "")+
          '<p class="note" style="color:var(--ink-3)">'+esc(b.note)+"</p></div>"+
          '<div>'+(skills ? '<p class="dl">مهارات من سيرتك ظهرت في الإعلان</p><div class="skills">'+skills+"</div>" : "")+
            (gaps ? '<p class="dl" style="margin-top:14px">مجالات لم يذكرها الإعلان</p><div class="skills">'+gaps+"</div>" : "")+
          "</div>"+
        "</div>"+
        (j.description ? '<div class="excerpt">'+esc(String(j.description).slice(0,1400))+"</div>" : "")+
        '<div class="actions">'+
          '<a class="btn" href="'+esc(j.url)+'" target="_blank" rel="noopener">فتح الإعلان والتقديم</a>'+
          (alt ? '<span class="chip">منشور أيضًا على:</span>'+alt : "")+
        "</div>"+
      "</div></article>";
  }

  function draw(){
    const rows = apply();
    const list = document.getElementById("list");
    document.getElementById("countNote").textContent =
      AR.format(rows.length) + " من " + AR.format(jobs.length) + " شاغر";
    if(!rows.length){
      list.innerHTML = '<div class="empty">لا شواغر تطابق هذه المرشّحات.<br>جرّب توسيع نطاق المدينة أو الفترة الزمنية.</div>';
      return;
    }
    if(state.sort !== "score"){
      list.innerHTML = '<div class="rows">'+rows.map(card).join("")+"</div>";
    } else {
      let html = "";
      for(const b of BANDS){
        const grp = rows.filter(j => band(j.score).key === b.key);
        if(!grp.length) continue;
        html += '<div class="band"><h2>'+b.key+'</h2><span class="qty">'+AR.format(grp.length)+
          '</span><span class="rule"></span></div><div class="rows">'+grp.map(card).join("")+"</div>";
      }
      const rest = rows.filter(j => !BANDS.some(b => band(j.score).key === b.key));
      if(rest.length) html += '<div class="band"><h2>دون العتبة</h2><span class="qty">'+
        AR.format(rest.length)+'</span><span class="rule"></span></div><div class="rows">'+
        rest.map(card).join("")+"</div>";
      list.innerHTML = html;
    }
  }

  // ------------------------------------------------------------- tiles
  function tiles(){
    const fresh = jobs.filter(j => (ageDays(j) ?? 99) <= 1).length;
    const strong = jobs.filter(j => j.score >= 58).length;
    const top = jobs.length ? Math.max.apply(null, jobs.map(j=>j.score)) : 0;
    const srcOk = Object.entries(DATA.per_source||{}).filter(([,n]) => n > 0).length;
    const srcAll = Object.keys(DATA.per_source||{}).length;
    const t = [
      {k:"شواغر مفتوحة", v:AR.format(jobs.length), n:"بعد إزالة التكرار بين المصادر"},
      {k:"مرشّح قوي فأعلى", v:AR.format(strong), n:"درجة ٥٨ فما فوق", hi:true},
      {k:"نُشر خلال ٢٤ ساعة", v:AR.format(fresh), n:"حسب تاريخ النشر المعلن"},
      {k:"أعلى درجة مطابقة", v:top.toFixed(0), n:"من ١٠٠"},
      srcAll
        ? {k:"مصادر أنتجت بيانات", v:AR.format(srcOk)+"/"+AR.format(srcAll), n:"في آخر تشغيل"}
        : {k:"الجمع الآلي", v:"—", n:"لم يُشغَّل بعد"}
    ];
    document.getElementById("stats").innerHTML = t.map(x =>
      '<div class="tile'+(x.hi?" hi":"")+'"><div class="k">'+x.k+'</div><div class="v">'+x.v+
      '</div><div class="n">'+x.n+"</div></div>").join("");
  }

  // -------------------------------------------------------- side panels
  function restricted(){
    const plats = ((DATA.sources||{}).platforms)||[];
    const r = plats.filter(p => p.tier === 3);
    if(!r.length){ document.getElementById("restricted").style.display="none"; return; }
    let html = "<h2>مصادر تُفتح يدويًا</h2><p class=\"lede\">"+
      "لِنكدإن وإنديد يمنعان الجمع الآلي في شروط الاستخدام ويحجبان عناوين الخوادم السحابية، "+
      "فلا يجمعهما المحرك آليًا. بدلًا من ذلك يولّد روابط بحث مضبوطة مسبقًا على تخصصك ومدنك وفترة النشر — "+
      "افتحها من متصفحك بحسابك.</p>";
    for(const p of r){
      html += '<p class="dl" style="margin-top:14px">'+esc(p.name_ar)+"</p><div class=\"link-grid\">"+
        (p.saved_searches||[]).map(s =>
          '<a class="link-card" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+
          '<span>'+esc(s.label)+'</span><span class="arrow">↗</span></a>').join("")+"</div>";
    }
    document.getElementById("restricted").innerHTML = html;
  }

  function health(){
    const per = DATA.per_source||{}, errs = DATA.errors||{};
    const keys = [...new Set([...Object.keys(per), ...Object.keys(errs)])].sort();
    let rows = keys.map(k => {
      const n = per[k]||0, e = errs[k];
      const cls = e ? "warn" : n > 0 ? "ok" : "off";
      const status = e ? "خطأ" : n > 0 ? "يعمل" : "بدون نتائج";
      return "<tr><td><span class=\"dot "+cls+"\"></span>"+esc(k)+"</td><td class=\"n\">"+AR.format(n)+
        "</td><td>"+status+"</td><td style=\"color:var(--ink-3);font-size:11.5px\">"+esc(e||"")+"</td></tr>";
    }).join("");
    if(!rows) rows = '<tr><td colspan="4" style="color:var(--ink-3)">لم يُسجَّل تشغيل جمع بعد.</td></tr>';
    document.getElementById("health").innerHTML =
      "<h2>حالة المصادر</h2><p class=\"lede\">كل مصدر وما أنتجه في آخر تشغيل. "+
      "المصدر الذي يظهر «خطأ» لم يُسقَط من المحرك — يُعاد محاولته في التشغيل التالي ويُسجَّل سبب الفشل هنا.</p>"+
      '<div class="scroll-x"><table class="health"><thead><tr><th>المصدر</th><th>عدد الشواغر</th>'+
      "<th>الحالة</th><th>الملاحظة</th></tr></thead><tbody>"+rows+"</tbody></table></div>";
  }

  // -------------------------------------------------------------- wire up
  document.getElementById("q").addEventListener("input", e => {
    state.q = e.target.value; persist(); draw();
  });
  cityEl.addEventListener("change", e => { state.city = e.target.value; persist(); draw(); });
  srcEl.addEventListener("change", e => { state.source = e.target.value; persist(); draw(); });
  document.getElementById("sort").addEventListener("change", e => {
    state.sort = e.target.value; persist(); draw();
  });
  document.querySelectorAll("[data-age]").forEach(b => b.addEventListener("click", () => {
    state.age = b.dataset.age; persist();
    document.querySelectorAll("[data-age]").forEach(x =>
      x.setAttribute("aria-pressed", String(x === b)));
    draw();
  }));
  document.addEventListener("click", e => {
    const head = e.target.closest(".row-head");
    if(!head) return;
    const row = head.closest(".row");
    row.toggleAttribute("open");
  });
  document.addEventListener("keydown", e => {
    if(e.key !== "Enter" && e.key !== " ") return;
    const head = e.target.closest(".row-head");
    if(!head) return;
    e.preventDefault();
    head.closest(".row").toggleAttribute("open");
  });

  const gen = new Date(DATA.generated_at);
  document.getElementById("stamp").textContent = "آخر تحديث " +
    (isNaN(gen) ? DATA.generated_at
      : gen.toLocaleString("ar-SA-u-ca-gregory", {dateStyle:"medium", timeStyle:"short"}));
  document.getElementById("foot").innerHTML =
    "يعمل المحرك على جدولة يومية ويقارن كل شاغر بسيرة عبدالسلام الفيفي عبر خمسة معايير موزونة: "+
    "المسمى (٣٠) وتغطية المهارات (٣٥) ومستوى الخبرة (١٥) والموقع (١٢) وحداثة الإعلان (٨). "+
    "الدرجة تفسيرية لا قاطعة — راجع الإعلان الأصلي قبل التقديم.";

  if(DATA.notice){
    document.getElementById("notice").innerHTML =
      '<div class="notice-bar"><strong>حالة البيانات</strong><span>'+esc(DATA.notice)+"</span></div>";
  }

  tiles(); restricted(); health(); draw();
})();
</script>
