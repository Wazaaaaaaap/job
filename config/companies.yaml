# Employer registry.
#
# Two kinds of entry:
#   1. RESOLVED  - family + tenant keys are known, the collector runs directly.
#   2. UNRESOLVED - only `careers_url` is known. scripts/discover_ats.py probes the
#      page on the runner (which has real internet), detects the ATS and rewrites
#      this file with the resolved keys. Anything it cannot resolve is reported in
#      the dashboard's source-health panel rather than silently dropped.
#
# Verification status is tracked per entry so the dashboard never presents an
# unverified source as if it were confirmed working.

resolved: []
# Example of the shape discovery writes back:
#   - id: almarai
#     name: Almarai
#     name_ar: المراعي
#     family: workday
#     host: https://almarai.wd3.myworkdayjobs.com
#     tenant: almarai
#     site: External
#     verified: false

